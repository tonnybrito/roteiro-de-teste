appId: com.exemplo.trilhadosbichos.ios
# Captures all 9 creatures. Parameterized via env:
#   TRAP_TARGET  - what to long-press to capture ("idle" for Halloween/Xmas,
#                  "trap-default-<theme>" for Easter/July4)
#   CAPTURE_TEXT - text asserted on the reward card ("Pin Collected", etc.)
#   THEME        - storyboard folder name (screenshots/flow-<THEME>/)
# A second CONTINUE is tapped only if it appears (Halloween shows an extra screen).
# Assumes the hub tutorial has already been advanced (done per-theme in the hunt).
#
# For every capture this records three storyboard frames:
#   cap-Na-grid  - the hub / "hat" with N-1 creatures already collected
#   cap-Nb-found - the creature found in the world, before trapping
#   cap-Nc-card  - the reward card (creature trapped, running X/9 count)
---
- takeScreenshot: "screenshots/flow-${THEME}/cap-1a-grid"
- tapOn:
    id: "trapSlot_0"
- tapOn:
    text: .*Permitir*
    optional: true
- tapOn:
    id: "debugCaptureButton"
- takeScreenshot: "screenshots/flow-${THEME}/cap-1b-found"
- longPressOn: ${TRAP_TARGET}
- assertVisible: ${CAPTURE_TEXT}
- takeScreenshot: "screenshots/flow-${THEME}/cap-1c-card"
- tapOn: "CONTINUE"
- runFlow:
    when:
        visible: "CONTINUE"
    commands:
        - tapOn: "CONTINUE"

