appId: ${APP}
# Credits + the 4 ads + back to carousel, opened through the debug link (as after a hunt)
---
- launchApp:
    stopApp: true
    arguments:
      startGame: ${THEME}
      debugScreen: "credits"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
        id: "creditsTitle"
    timeout: 20000
- takeScreenshot: "shots/${DEV}/${THEME}-17-credits"
- scrollUntilVisible:
    element:
        id: "creditsProductLink_teeTimeTrainer"
    direction: DOWN
- tapOn:
    id: "creditsProductLink_teeTimeTrainer"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: "shots/${DEV}/${THEME}-18-ad1-tee-time-trainer"
- runFlow:
    when:
        visible: "Close tab|Fechar guia"
    commands:
        - tapOn: "Close tab|Fechar guia"
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - pressKey: back
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - launchApp:
            stopApp: false
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
        id: "creditsProductLink_prayerStones"
    direction: DOWN
- tapOn:
    id: "creditsProductLink_prayerStones"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: "shots/${DEV}/${THEME}-18-ad2-prayer-stones"
- runFlow:
    when:
        visible: "Close tab|Fechar guia"
    commands:
        - tapOn: "Close tab|Fechar guia"
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - pressKey: back
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - launchApp:
            stopApp: false
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
        id: "creditsProductLink_studioWebsite"
    direction: DOWN
- tapOn:
    id: "creditsProductLink_studioWebsite"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: "shots/${DEV}/${THEME}-18-ad3-studio-site"
- runFlow:
    when:
        visible: "Close tab|Fechar guia"
    commands:
        - tapOn: "Close tab|Fechar guia"
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - pressKey: back
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
        notVisible:
            id: "creditsTitle"
    commands:
        - launchApp:
            stopApp: false
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "shots/${DEV}/${THEME}-17b-credits-after-ads"
- scrollUntilVisible:
    element:
        id: "creditsChooseAnotherSeekButton"
    direction: DOWN
- tapOn:
    id: "creditsChooseAnotherSeekButton"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: "Choose your adventure"
    timeout: 20000
- takeScreenshot: "shots/${DEV}/${THEME}-19-back-to-carousel"
