<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roteiro de teste</title>
  <script>
    // Define o tema ANTES do CSS pintar a página, pra não dar aquele flash de claro→escuro.
    (function () {
      try {
        var saved = localStorage.getItem('ssq_theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-light:  #7C8FF5;
      --brand-mid:    #5E6AD2;
      --brand-dark:   #454FB0;
      --brand-darker: #2E3688;
      --brand-text:   #2A2E3F;

      --gray-50:  #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;

      --wait:   #F59E0B;   /* aguarda supervisor */
      --qa:     #3B82F6;   /* depende do QA  */
      --third:  #8B5CF6;   /* terceiros      */
      --done:   #22C55E;   /* fechado        */
      --toclose:#14B8A6;   /* por fechar     */

      --shadow:    0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -1px rgba(0,0,0,.06);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.12), 0 10px 10px -5px rgba(0,0,0,.04);
      --radius: 14px;

      --surface: #fff;
      --ink: #111827;
      --st-red-bg: #fdecec;      --st-red-border: #f3b4b4;    --st-red-text: #b42318;    --st-red-text-strong: #8a1c14;
      --st-green-bg: #e9f9ef;    --st-green-border: #b7ebc9;  --st-green-border-2: #9ad9b3; --st-green-text: #0f7a3d;
      --st-amber-bg: #fef6e7;    --st-amber-border: #f0c674;  --st-amber-border-2: #f7dfae; --st-amber-text: #9a6a00; --st-amber-text-strong: #8a5a00;
      --st-blue-bg: #eaf1ff;     --st-blue-border: #c3d6ff;   --st-blue-text: #1d4ed8;
      --st-neutral-bg: #f2f3f5; --st-neutral-border: #dfe1e6; --st-neutral-text: #5b5f6b;
      --st-tint-bg: #f4f5ff;    --st-tint-border: #d6dbff;
      --st-red-solid: #b42318; --st-green-solid: #0f7a3d; --st-amber-solid: #9a6a00; /* preenchimento sólido (pílulas/botões) — fixo nos dois temas, sempre com texto branco */
    }
    html[data-theme="dark"] {
      --brand-text: #dfe1f0;
      --surface: #161a22;

      --gray-50:  #0d1015;
      --gray-100: #161a21;
      --gray-200: #262c37;
      --gray-300: #38404e;
      --gray-400: #7d8798;
      --gray-500: #9aa3b2;
      --gray-600: #b3bac7;
      --gray-700: #cbd0da;
      --gray-800: #e2e5ea;
      --gray-900: #f5f6f8;

      --st-red-bg: #3a1618;      --st-red-border: #6b2329;    --st-red-text: #ff8a80;    --st-red-text-strong: #ffb4a8;
      --st-green-bg: #10301f;    --st-green-border: #1f5c3a;  --st-green-border-2: #2c7a4d; --st-green-text: #6fe3a0;
      --st-amber-bg: #362708;    --st-amber-border: #6b4e12;  --st-amber-border-2: #7c5a16; --st-amber-text: #f2c14e; --st-amber-text-strong: #f0b93c;
      --st-blue-bg: #142a4a;     --st-blue-border: #234a7c;   --st-blue-text: #7fb0ff;
      --st-neutral-bg: #1c2028; --st-neutral-border: #333947; --st-neutral-text: #a7aec0;
      --st-tint-bg: #1c2040;    --st-tint-border: #2f3570;

      --brand-dark: #8FA0FF; /* azul mais claro no escuro — o original fica apagado em texto/borda sobre fundo escuro */
    }
    html[data-theme="dark"] .todo-item.pending .todo-mark { background: var(--gray-200); border-color: var(--gray-500); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--brand-text);
      min-height: 100vh;
    }

    /* ─── HEADER ─────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, var(--brand-darker) 0%, var(--brand-dark) 55%, #6673e0 100%);
      padding: 40px 40px 46px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,143,245,.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-inner {
      max-width: 1160px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .header-logo {
      width: 112px; height: 112px;
      border-radius: 20px;
      background: #fff;
      border: 2px solid rgba(255,255,255,.35);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    /* Substitua este SVG por <img src="logo-do-projeto.png" style="width:88px"> quando tiver o arquivo. */
    .header-logo svg { width: 84px; height: 84px; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(124,143,245,.20);
      border: 1px solid rgba(124,143,245,.38);
      color: #cdd5ff;
      font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 20px; margin-bottom: 10px;
    }
    .header-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand-light); animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .header-title { font-size: 32px; font-weight: 800; color: #fff; line-height: 1.12; letter-spacing: -.5px; }
    .header-subtitle { font-size: 14.5px; color: rgba(255,255,255,.62); margin-top: 7px; }
    .header-right { margin-left: auto; text-align: right; flex-shrink: 0; }
    .header-right .hr-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
    .header-right .hr-value { font-size: 15px; font-weight: 700; color: #fff; margin-top: 2px; }
    .header-right .hr-logout {
      display: inline-block; margin-top: 10px; font-size: 11.5px; font-weight: 700;
      color: rgba(255,255,255,.7); text-decoration: none; border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px; padding: 4px 12px; transition: color .14s, border-color .14s, background .14s;
    }
    .header-right .hr-logout:hover { color: #fff; border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.08); }
    .theme-toggle {
      appearance: none; cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
      color: #fff; font-size: 12px; font-weight: 700;
      padding: 6px 12px; border-radius: 999px; margin-bottom: 10px;
      transition: background .14s, border-color .14s;
    }
    .theme-toggle:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5); }

    /* ─── NAV ────────────────────────────────────────────── */
    .nav-wrapper { background: var(--surface); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 20; box-shadow: var(--shadow); }
    .nav { max-width: 1160px; margin: 0 auto; display: flex; gap: 4px; padding: 0 24px; overflow-x: auto; }
    .nav-tab {
      appearance: none; background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--gray-500);
      padding: 15px 16px; border-bottom: 3px solid transparent; white-space: nowrap;
      transition: color .15s, border-color .15s, background .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .nav-tab:hover { color: var(--brand-dark); background: var(--st-tint-bg); }
    .nav-tab.active { color: var(--brand-dark); border-bottom-color: var(--brand-dark); font-weight: 800; }
    .nav-count {
      background: var(--gray-200); color: var(--gray-600);
      font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; min-width: 20px; text-align: center;
    }
    .nav-tab.active .nav-count { background: var(--brand-mid); color: #fff; }
    .nav-select {
      display: none;
      width: 100%;
      font-family: inherit; font-size: 14px; font-weight: 700;
      color: var(--brand-dark);
      padding: 14px 40px 14px 20px;
      border: none;
      background-color: var(--surface);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23454FB0' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 18px center;
      appearance: none; -webkit-appearance: none;
    }
    .nav-select:focus { outline: 2px solid var(--brand-mid); outline-offset: -2px; }

    /* ─── CONTENT ────────────────────────────────────────── */
    .container { max-width: 1160px; margin: 0 auto; padding: 40px 24px 80px; }
    .tab-content { display: none; animation: fadeUp .28s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .section-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-mid); margin-bottom: 8px; }
    .section-title { font-size: 24px; font-weight: 800; color: var(--gray-900); margin-bottom: 6px; }
    .section-sub { font-size: 14.5px; color: var(--gray-500); margin-bottom: 30px; line-height: 1.55; max-width: 760px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    /* ─── LEITURAS (sub-abas) ────────────────────────────── */
    .subnav {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 26px; padding-bottom: 16px; border-bottom: 1px solid var(--gray-200);
    }
    .subtab {
      appearance: none; font-family: inherit; cursor: pointer;
      font-size: 13px; font-weight: 700; border-radius: 999px; padding: 8px 16px;
      border: 1px solid var(--gray-300); background: var(--surface); color: var(--gray-600);
      transition: color .14s, border-color .14s, background .14s;
    }
    .subtab:hover { border-color: var(--brand-mid); color: var(--brand-dark); }
    .subtab.active { background: var(--brand-mid); border-color: var(--brand-mid); color: #fff; }
    .reading-panel { display: none; }
    .reading-panel.active { display: block; animation: fadeUp .28s ease; }
    .reading-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      flex-wrap: wrap; padding-bottom: 18px; margin-bottom: 22px; border-bottom: 2px solid var(--gray-100);
    }
    .reading-head-id { font-size: 12px; font-weight: 800; color: var(--gray-500); letter-spacing: .04em; }
    .reading-head-title { font-size: 20px; font-weight: 800; color: var(--gray-900); margin-top: 3px; }
    .reading-head .btn { flex-shrink: 0; min-height: 34px; }
    .reading-body { max-width: 820px; }
    .reading-body h3 {
      font-size: 19px; font-weight: 800; color: var(--gray-900);
      margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gray-100);
    }
    .reading-body h3:first-child { margin-top: 0; }
    .reading-body h4 { font-size: 14px; font-weight: 800; color: var(--brand-dark); margin: 20px 0 6px; }
    .reading-body p { font-size: 14.5px; line-height: 1.72; color: var(--gray-700); margin-bottom: 12px; }
    .reading-body ul, .reading-body ol { margin: 0 0 14px 22px; }
    .reading-body li { font-size: 14.5px; line-height: 1.7; color: var(--gray-700); margin-bottom: 6px; }
    .reading-body strong { color: var(--gray-900); }
    .reading-body em { color: var(--gray-600); }
    .reading-body code {
      background: var(--gray-100); padding: 1px 5px; border-radius: 4px;
      font-size: 13px; color: var(--gray-700);
    }
    .reading-callout {
      background: var(--st-tint-bg); border: 1px solid var(--st-tint-border); border-left: 4px solid var(--brand-mid);
      border-radius: 10px; padding: 14px 16px; margin: 16px 0;
    }
    .reading-callout p { margin-bottom: 0; }
    .reading-meta {
      font-size: 12.5px; color: var(--gray-500); background: var(--gray-50);
      border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 14px; margin-bottom: 22px;
    }

    /* ─── PLANILHA DO WALK ───────────────────────────────── */
    #walk-progress {
      background: var(--surface); border: 1px solid var(--gray-200); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 22px; display: flex; flex-direction: column; gap: 8px;
    }
    .walk-progress-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .walk-progress-label { font-size: 13.5px; font-weight: 800; color: var(--gray-800); }
    .walk-progress-counts { font-size: 12px; color: var(--gray-500); display: flex; gap: 12px; flex-wrap: wrap; }
    .walk-progress-bar-track { height: 8px; border-radius: 999px; background: var(--gray-100); overflow: hidden; }
    .walk-progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand-light), var(--brand-mid)); border-radius: 999px; transition: width .2s; }
    .walk-section-h {
      font-size: 13px; font-weight: 800; color: var(--brand-dark); text-transform: uppercase; letter-spacing: .04em;
      margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gray-100);
    }
    .walk-section-h:first-child { margin-top: 0; }
    .walk-device-h { font-size: 11.5px; font-weight: 800; color: var(--gray-500); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 8px; }
    .walk-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 9px 10px; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--surface);
      margin-bottom: 6px; transition: border-color .15s, background .15s;
    }
    .walk-row.is-pass { border-color: var(--st-green-border); background: var(--st-green-bg); }
    .walk-row.is-finding { border-color: var(--st-red-border); background: var(--st-red-bg); }
    .walk-row.is-not-tested { border-color: var(--st-neutral-border); background: var(--st-neutral-bg); }
    .walk-row-main { display: flex; align-items: baseline; gap: 8px; flex: 1 1 260px; min-width: 0; }
    .walk-row-id { font-size: 11px; font-weight: 800; color: var(--gray-500); flex-shrink: 0; width: 34px; }
    .walk-row-scenario { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; flex-shrink: 0; }
    .walk-row-label { font-size: 13px; color: var(--gray-800); line-height: 1.4; }
    .walk-row-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .walk-row-controls select, .walk-row-controls input {
      font-family: inherit; font-size: 12px; border: 1px solid var(--gray-300); border-radius: 6px;
      padding: 5px 8px; background: var(--surface); color: var(--gray-800);
    }
    .walk-row-controls select { font-weight: 700; min-width: 128px; }
    .walk-row-controls input.walk-extra { width: 100px; }
    .walk-row-controls input.walk-note { width: 150px; }
    @media (max-width: 720px) {
      .walk-row { flex-direction: column; align-items: stretch; }
      .walk-row-controls input.walk-extra, .walk-row-controls input.walk-note { width: 100%; }
    }

    .card {
      background: var(--surface); border: 1px solid var(--gray-200); border-radius: var(--radius);
      border-left: 5px solid var(--accent, var(--gray-300));
      padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: var(--shadow); transition: transform .14s, box-shadow .14s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-id {
      font-size: 11.5px; font-weight: 800; letter-spacing: .03em;
      background: var(--gray-100); color: var(--gray-700); padding: 3px 9px; border-radius: 6px;
    }
    .tag {
      font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 999px; color: #fff;
    }
    .card-title { font-size: 15px; font-weight: 700; color: var(--gray-900); line-height: 1.35; }
    .card-line { font-size: 13px; color: var(--gray-600); line-height: 1.5; }
    .card-line strong { color: var(--gray-800); }

    .todo-title {
      font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
      color: var(--gray-400); margin-top: 2px;
    }
    .todo-list { display: flex; flex-direction: column; gap: 6px; }
    .todo-item { display: flex; align-items: flex-start; gap: 7px; }
    .todo-item .todo-mark {
      flex-shrink: 0; width: 15px; height: 15px; border-radius: 5px; margin-top: 1px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; line-height: 1;
    }
    .todo-item.done .todo-mark { background: var(--st-green-bg); color: var(--st-green-text); border: 1px solid var(--st-green-border); }
    .todo-item.pending .todo-mark { background: var(--surface); color: transparent; border: 1px solid var(--gray-300); }
    .todo-item .todo-text { font-size: 12.5px; line-height: 1.45; }
    .todo-item.done .todo-text { color: var(--gray-500); text-decoration: line-through; text-decoration-color: var(--gray-300); }
    .todo-item.pending .todo-text { color: var(--gray-700); }

    /* ─── RECADOS ────────────────────────────────────────── */
    .recado-banner {
      display: none; background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
    }
    .recado-banner.show { display: block; }
    .recado-banner-inner {
      max-width: 1160px; margin: 0 auto; padding: 10px 24px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .rb-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 13px; line-height: 1.4;
    }
    .rb-row strong { font-weight: 800; }
    .rb-row.red   { color: var(--st-red-text-strong); }
    .rb-row.amber { color: var(--st-amber-text-strong); }
    .rb-row.green { color: var(--st-green-text); }
    .recado-banner-chip {
      appearance: none; cursor: pointer; font-family: inherit;
      background: var(--surface); border: 1px solid currentColor; color: inherit;
      font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    }
    .recado-banner-chip:hover { filter: brightness(1); background: rgba(0,0,0,.03); }

    .recado {
      border-radius: 10px; padding: 10px 12px; border: 1px solid;
      display: flex; flex-direction: column; gap: 4px;
    }
    .recado-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .recado-who { font-size: 11.5px; font-weight: 800; }
    .recado-when { font-size: 10.5px; color: var(--gray-500); }
    .recado-text { font-size: 12.5px; line-height: 1.45; color: var(--gray-700); }
    .recado-pill {
      font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 999px; white-space: nowrap; color: #fff;
    }
    .recado.pending  { background: var(--st-red-bg); border-color: var(--st-red-border); }
    .recado.pending  .recado-pill { background: var(--st-red-solid); }
    .recado.pending  .recado-who  { color: var(--st-red-text-strong); }
    .recado.answered { background: var(--st-green-bg); border-color: var(--st-green-border); }
    .recado.answered .recado-pill { background: var(--st-green-solid); }
    .recado.answered .recado-who  { color: var(--st-green-text); }
    .recado.info     { background: var(--gray-50); border-color: var(--gray-200); }
    .recado.info     .recado-pill { background: var(--gray-400); }
    .recado.info     .recado-who  { color: var(--gray-600); }
    .recado.due      { background: var(--st-amber-bg); border-color: var(--st-amber-border); }
    .recado.due      .recado-pill { background: var(--st-amber-solid); }
    .recado.due      .recado-who  { color: var(--st-amber-text); }

    /* ─── CALENDÁRIO DE RESPOSTA DIÁRIA ─────────────────── */
    .cal-day { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--gray-100); }
    .cal-day:last-child { border-bottom: none; }
    .cal-day-date { width: 68px; flex-shrink: 0; font-size: 12.5px; font-weight: 800; color: var(--gray-800); }

  <header class="header">

    <section id="como" class="tab-content active">

        <label><span data-i18n="envApp"></span><input id="env-app" oninput="setEnv('app', this.value)"></label>

      <div id="walk-progress"></div>
      <div id="summary"></div>

      <div class="cmp-wrap" id="compare"></div>

      },
      exportIntro: { pt: 'Aqui está o resultado do roteiro "{t}", rodada {r}, preenchido pelo HTML de teste.', en: 'Here is the result of the "{t}" checklist, round {r}, filled in through the test HTML.' },
      exportAsk: { pt: 'Para cada "Falhou", me mostra o rascunho do achado antes de registrar qualquer coisa.', en: 'For each "Failed", show me the draft finding before filing anything.' },
      exportDevice: { pt: 'Aparelho', en: 'Device' },
      exportSummary: { pt: 'Resumo', en: 'Summary' },
      FAIL: { pt: 'FALHOU', en: 'FAILED' }, SKIP: { pt: 'NÃO TESTADO', en: 'NOT TESTED' }, PASS: { pt: 'PASSOU', en: 'PASSED' }, PEND: { pt: 'PENDENTE', en: 'PENDING' },
      noteWord: { pt: 'nota', en: 'note' },
      qaSaw: { pt: 'O que o QA viu', en: 'What QA saw' },
      shotsHint: { pt: 'clique no print para ampliar', en: 'click a screenshot to enlarge' },
      retestChanged: { pt: '↻ Alterado: retestar', en: '↻ Changed: retest' }, retestLinked: { pt: '↻ Ligado a', en: '↻ Linked to' },
      audPass: { pt: '🔎 Auditor aprovou', en: '🔎 Auditor approved' }, audFail: { pt: '🔎 Auditor reprovou', en: '🔎 Auditor rejected' },
      outOfScope: { pt: 'Fora do escopo', en: 'Out of scope' },
      sev_blocker: { pt: '🟥 Bloqueia', en: '🟥 Blocker' }, sev_major: { pt: '🟧 Grave', en: '🟧 Major' },
      sev_minor: { pt: '🟦 Menor', en: '🟦 Minor' }, sev_cosmetic: { pt: '⬜ Cosmético', en: '⬜ Cosmetic' }
    };

    /* ─── CONFIGURAÇÃO (o que o Claude escreve) ─────────── */
    const CFG = JSON.parse(document.getElementById('roteiro-config').textContent || '{}');
    const PLATS = CFG.plataformas || [];
    const ROUNDS = CFG.rodadas || [];
    const VAR = CFG.variacoes || null;
    const TABS = CFG.abas || [];
    const CARDS = CFG.cards || [];
    const STORE = 'roteiro_' + (CFG.chave || 'sem-chave');

    let LANG = CFG.idiomaPadrao || 'pt';
    try { LANG = localStorage.getItem('roteiro_lang') || LANG; } catch (e) {}
    const L = x => x == null ? '' : typeof x === 'string' ? x : (x[LANG] != null ? x[LANG] : (x.pt != null ? x.pt : x.en || ''));
    const T = (k, vars) => { let s = L(UI[k]); Object.keys(vars || {}).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); }); return s; };

    /* ─── ESTADO ────────────────────────────────────────── */
    const ultima = ROUNDS.length ? ROUNDS[ROUNDS.length - 1].id : '';
    let VIEW = { plat: PLATS.length ? PLATS[0].id : '', round: ultima, variant: 'all', show: 'totest', tab: 'como' };
    try { VIEW = Object.assign(VIEW, JSON.parse(localStorage.getItem(STORE + '_view') || '{}')); } catch (e) {}
    if (!PLATS.some(p => p.id === VIEW.plat)) VIEW.plat = PLATS.length ? PLATS[0].id : '';
    if (!ROUNDS.some(r => r.id === VIEW.round)) VIEW.round = ultima;
    function saveView() { try { localStorage.setItem(STORE + '_view', JSON.stringify(VIEW)); } catch (e) {} }

    /* marcas[card][plataforma][rodada] = { result, note } — o arquivo manda; o navegador só guarda rascunho. */
    const clone = o => JSON.parse(JSON.stringify(o || {}));
    let SALVO = { marcas: {}, env: {} };
    try {
      const d = JSON.parse(document.getElementById('dados-salvos').textContent || '{}');
      if (d.salvoEm) SALVO = { marcas: d.marcas || {}, env: d.env || {} };
    } catch (e) {}
    let STATE = clone(SALVO);
    try {
      const rascunho = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (rascunho && rascunho.base === JSON.stringify(SALVO)) STATE = { marcas: rascunho.marcas || {}, env: rascunho.env || {} };
    } catch (e) {}
    function save() { try { localStorage.setItem(STORE, JSON.stringify({ base: JSON.stringify(SALVO), marcas: STATE.marcas, env: STATE.env })); } catch (e) {} }

    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    const roundIdx = id => ROUNDS.findIndex(r => r.id === id);
    const roundLabel = id => { const r = ROUNDS.find(x => x.id === id); return r ? L(r.rotulo) : id; };
    const platLabel = id => { const p = PLATS.find(x => x.id === id); return p ? L(p.rotulo) : id; };
    const curRound = () => ROUNDS.find(r => r.id === VIEW.round) || {};

    function mark(id, plat, round) { return (((STATE.marcas[id] || {})[plat] || {})[round]) || {}; }
    /* Auditor: liga por padrão; "auditoria": false no config desliga para o roteiro todo, "semAuditoria": true num card. */
    const AUD = CFG.auditoria !== false;
    const needsAudit = c => AUD && !c.semAuditoria;
    /* Estado do card: verde só quando o QA aprovou E o Auditor aprovou (se o card tem auditoria). */
    function st(c, m) {
      if (!m || !m.result) return '';
      if (m.result !== 'pass' || !needsAudit(c)) return m.result;
      return m.audit === 'pass' ? 'pass' : m.audit === 'fail' ? 'auditFail' : 'wait';
    }
    function appliesPlat(c, plat) { return !c.plataformas || !c.plataformas.length || c.plataformas.includes(plat); }
    function existsIn(c, round) { return roundIdx(c.desde || (ROUNDS[0] || {}).id) <= roundIdx(round); }
    function prevMark(c, plat, round) {
      for (let i = roundIdx(round) - 1; i >= 0; i--) {
        const s = st(c, mark(c.id, plat, ROUNDS[i].id));
        if (s) return { round: ROUNDS[i].id, result: s };
      }
      return null;
    }
    /* Por que um card já aprovado volta: o dev alterou ele nesta rodada, ou alterou um card ligado a ele (A pode quebrar B). */
    function retestReason(c, round) {
      const alt = ((ROUNDS.find(x => x.id === round) || {}).retestar || []);
      if (alt.includes(c.id)) return { tipo: 'changed' };
      const lig = alt.filter(id => (c.ligados || []).includes(id)
        || ((CARDS.find(x => x.id === id) || {}).ligados || []).includes(c.id));
      return lig.length ? { tipo: 'linked', ids: lig } : null;
    }
    /* Precisa testar nesta rodada: card novo, repasse geral, alterado (ou ligado a um alterado), ou o último resultado não foi "passou". */
    function needsTest(c, plat, round) {
      if (c.foraDoEscopo || !appliesPlat(c, plat) || !existsIn(c, round)) return false;
      const r = ROUNDS.find(x => x.id === round) || {};
      if (r.regressao || (c.desde || (ROUNDS[0] || {}).id) === round || retestReason(c, round)) return true;
      const p = prevMark(c, plat, round);
      return !p || p.result !== 'pass';
    }
    const inScope = () => CARDS.filter(c => needsTest(c, VIEW.plat, VIEW.round));

    /* ─── TEXTOS FIXOS, CABEÇALHO E ESCOLHAS ────────────── */
    function applyStatic() {
      document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-BR';
      document.title = L(CFG.tituloAba || CFG.titulo);
      document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
      document.getElementById('hBadge').textContent = L(CFG.selo);
      document.getElementById('hTitle').textContent = L(CFG.titulo);
      document.getElementById('hSub').innerHTML = L(CFG.subtitulo);
      document.getElementById('footnote').innerHTML = L(CFG.rodape);
      document.getElementById('langToggle').textContent = T('langBtn');
      ['device', 'os', 'app'].forEach(k => { const el = document.getElementById('env-' + k); if (el) el.placeholder = L((CFG.exemplosAparelho || {})[k]); });
      syncThemeToggleUI();
      syncSaveMode();
      renderHowCards();
    }
    /* "Como usar": tabela de onde cada card vale, montada a partir dos próprios cards. */
    function renderHowCards() {
      const el = document.getElementById('howCards');
      if (!el) return;
      const temVar = VAR && VAR.itens && VAR.itens.length;
      const cards = CARDS.filter(c => !c.foraDoEscopo);
      const varTxt = c => (c.variacoes && c.variacoes.length)
        ? c.variacoes.map(v => { const it = VAR.itens.find(x => x.id === v); return esc(it ? L(it.rotulo) : v); }).join(', ')
        : `<b>${esc(L(VAR.todosRotulo) || T('allVariants'))}</b>`;
      const platTxt = c => (c.plataformas && c.plataformas.length) ? c.plataformas.map(p => esc(platLabel(p))).join(', ') : T('howAllPlats');
      const tabTxt = c => { const t = TABS.find(x => x.id === c.aba); return t ? L(t.titulo) : esc(c.aba); };
      let html = `<h3>${T('howCardsTitle')}</h3><p>${temVar ? T('howCardsIntro', { v: esc(L(VAR.rotulo)) }) : T('howCardsIntroNoVar')}</p>`;
      html += `<div class="cmp-wrap"><table class="cmp"><thead><tr><th>${T('howColCard')}</th><th>${T('howColTab')}</th>${temVar ? `<th>${T('howColVar')}</th>` : ''}${PLATS.length > 1 ? `<th>${T('howColPlat')}</th>` : ''}${ROUNDS.length > 1 ? `<th>${T('howColSince')}</th>` : ''}</tr></thead><tbody>`
        + cards.map(c => `<tr><td><b>${esc(c.id)}</b> ${L(c.titulo)}</td><td>${tabTxt(c)}</td>${temVar ? `<td>${varTxt(c)}</td>` : ''}${PLATS.length > 1 ? `<td>${platTxt(c)}</td>` : ''}${ROUNDS.length > 1 ? `<td>${esc(roundLabel(c.desde || ROUNDS[0].id))}</td>` : ''}</tr>`).join('')
        + '</tbody></table></div>';
      if (temVar) {
        html += `<p style="margin-top:12px">${T('howPerVar')}</p><div class="vlist">` + VAR.itens.map(v =>
          `<div><b>${esc(L(v.rotulo))}:</b> ${cards.filter(c => !c.variacoes || !c.variacoes.length || c.variacoes.includes(v.id)).map(c => esc(c.id)).join(', ')}</div>`).join('') + '</div>';
      }
      html += `<div class="tip">💡 ${T('howTipPlat')}</div>`;
      el.innerHTML = html;
    }
    function buildPickers() {
      const sp = document.getElementById('pickPlat');
      sp.innerHTML = PLATS.map(p => `<option value="${p.id}" ${p.id === VIEW.plat ? 'selected' : ''}>${esc(L(p.rotulo))}</option>`).join('');
      document.getElementById('pickPlatWrap').style.display = PLATS.length > 1 ? '' : 'none';
      const sr = document.getElementById('pickRound');
      sr.innerHTML = ROUNDS.map(r => `<option value="${r.id}" ${r.id === VIEW.round ? 'selected' : ''}>${esc(L(r.rotulo))}${r.regressao ? ' ↺' : ''}</option>`).join('');
      document.getElementById('pickHint').innerHTML = T('hint', { p: esc(platLabel(VIEW.plat)), r: esc(roundLabel(VIEW.round)) })
        + (curRound().regressao ? '<br><b>↺ ' + T('regression') + '</b>' : '');
    }
    function buildTabs() {
      document.getElementById('dynTabs').innerHTML = TABS.map(t => `
        <section id="${t.id}" class="tab-content">
          ${t.selo ? `<div class="section-label">${L(t.selo)}</div>` : ''}
          <h2 class="section-title">${L(t.titulo)}</h2>
          ${t.sub ? `<p class="section-sub">${L(t.sub)}</p>` : ''}
          ${VAR && VAR.itens && VAR.itens.length ? '<div class="filterbar" data-filterbar></div>' : ''}
          <div class="showbar" data-showbar></div>
          <div class="cards" data-render="${t.id}"></div>
        </section>`).join('');
      const tabs = [['como', T('howTab')]].concat(TABS.map(t => [t.id, L(t.titulo)]), [['resultado', T('resTab')], ['salvar', T('saveTab')]]);
      document.getElementById('navTabs').innerHTML = tabs.map(([id, label]) =>
        `<button class="nav-tab" data-tab="${id}" onclick="showTab('${id}')">${esc(label)} ${id === 'como' || id === 'salvar' ? '' : `<span class="nav-count" data-count="${id}"></span>`}</button>`).join('');
    }

    /* ─── CARDS ─────────────────────────────────────────── */
    function cardHTML(c) {
      const plat = VIEW.plat, round = VIEW.round;
      const ans = mark(c.id, plat, round);
      const tab = TABS.find(t => t.id === c.aba) || {};
      const chips = [];
      const vars = c.variacoes || [];
      if (VAR && VAR.itens && VAR.itens.length) {
        if (!vars.length) chips.push(`<span class="chip">${esc(L(VAR.todosRotulo) || T('allVariants'))}</span>`);
        else vars.forEach(v => { const it = VAR.itens.find(x => x.id === v); chips.push(`<span class="chip">${esc(it ? L(it.rotulo) : v)}</span>`); });
      }
      if (c.plataformas && c.plataformas.length && PLATS.length > 1) chips.push(`<span class="chip rt">${T('onlyPlat')} ${c.plataformas.map(p => esc(platLabel(p))).join(', ')}</span>`);
      if ((c.desde || (ROUNDS[0] || {}).id) === round && roundIdx(round) > 0) chips.push(`<span class="chip sound">${T('newIn')} ${esc(roundLabel(round))}</span>`);
      const rr = retestReason(c, round);
      if (rr) chips.push(`<span class="chip sound">${rr.tipo === 'changed' ? T('retestChanged') : T('retestLinked') + ' ' + rr.ids.map(esc).join(', ')}</span>`);
      (c.chips || []).forEach(x => chips.push(`<span class="chip">${esc(L(x))}</span>`));

      const prev = prevMark(c, plat, round);
      const carried = !ans.result && prev && prev.result === 'pass' && !needsTest(c, plat, round);
      let carry = '';
      if (prev && !ans.result) {
        const k = { pass: needsTest(c, plat, round) ? null : 'carriedPass', fail: 'carriedFail', auditFail: 'carriedAuditFail', wait: 'carriedWait', skip: 'carriedSkip' }[prev.result];
        if (k) carry = `<div class="carry ${prev.result === 'auditFail' ? 'fail' : prev.result}">${T(k, { r: esc(roundLabel(prev.round)) })}</div>`;
      }
      const qa = qaHTML(c, plat, round);
      if (qa.sev) chips.unshift(`<span class="chip sev-${qa.sev}">${T('sev_' + qa.sev)}</span>`);
      const est = st(c, ans);
      const cls = c.foraDoEscopo ? 'out' : carried ? 'carried' : est === 'pass' ? 'is-pass' + (temNota(ans) ? ' has-note' : '') : est === 'fail' || est === 'auditFail' ? 'is-fail' : est === 'wait' ? 'is-wait' : est === 'skip' ? 'is-skip' : '';
      const ph = est === 'auditFail' ? T('phAudit') : ans.result === 'fail' ? T('phFail') : ans.result === 'skip' ? T('phSkip') : T('phNote');
      return `
        <div class="card ${cls}" style="--accent:${tab.cor || 'var(--qa)'}" data-id="${c.id}">
          <div class="card-top">
            <span class="card-id">${esc(c.id)}</span>
            ${c.tag ? `<span class="tag" style="background:${c.corTag || 'var(--gray-500)'}">${esc(L(c.tag))}</span>` : ''}
          </div>
          <div class="card-title">${L(c.titulo)}</div>
          <div class="chips">${chips.join('')}</div>
          <div class="todo-title">${T('howToTest')}</div>
          <ol class="steps">${(c.passos || []).map(s => `<li>${L(s)}</li>`).join('')}</ol>
          <div class="todo-title">${T('passIf')}</div>
          <div class="expect">${L(c.passa)}</div>
          ${c.aviso ? `<div class="pending-note">⚠ ${L(c.aviso)}</div>` : ''}
          ${qa.html}
          ${carry}
          ${c.foraDoEscopo ? `<span class="rpill not-qa">${T('outOfScope')}: ${L(c.foraDoEscopo)}</span>` : `
          <div class="result">
            <div class="seg seg3" role="group">
              <div class="col"><div class="col-h">${T('colQA')}</div>
                <button class="pass ${ans.result === 'pass' ? 'on' : ''}" onclick="setResult('${c.id}','pass')">${est === 'pass' && temNota(ans) ? T('passNote') : T('pass')}</button>
                <button class="fail ${ans.result === 'fail' ? 'on' : ''}" onclick="setResult('${c.id}','fail')">${T('fail')}</button>
              </div>
              <div class="col"><div class="col-h">${T('colAud')}</div>${needsAudit(c) ? `
                <button class="pass aud ${ans.audit === 'pass' ? 'on' : ''}" ${ans.result === 'pass' ? '' : `disabled title="${esc(T('audWaitHint'))}"`} onclick="setAudit('${c.id}','pass')">${T('pass')}</button>
                <button class="fail aud ${ans.audit === 'fail' ? 'on' : ''}" ${ans.result === 'pass' ? '' : `disabled title="${esc(T('audWaitHint'))}"`} onclick="setAudit('${c.id}','fail')">${T('fail')}</button>` : `
                <div class="na-aud">${T('noAudit')}</div>`}
              </div>
              <div class="col"><div class="col-h"></div>
                <button class="skip ${ans.result === 'skip' ? 'on' : ''}" onclick="setResult('${c.id}','skip')">${T('skip')}</button>
              </div>
            </div>
            ${est === 'wait' ? `<div class="aud-status">${T('stWait')}</div>` : est === 'auditFail' ? `<div class="aud-status">${T('stAuditFail')}</div>` : ''}
            <textarea rows="2" placeholder="${esc(ph)}" oninput="setNote('${c.id}', this.value)">${esc(ans.note)}</textarea>
            <div class="save-row">${saveRowHTML(c.id)}</div>
          </div>`}
          ${histHTML(c)}
          ${c.link ? `<div class="card-actions"><a class="btn ghost" href="${esc(c.link)}" target="_blank" rel="noopener">${esc(L(c.linkRotulo) || 'Link')} ↗</a></div>` : ''}
        </div>`;
    }
    /* O que o QA viu nesta plataforma, da rodada mais recente até a escolhida. */
    function qaHTML(c, plat, round) {
      const ents = (c.qa || []).filter(q => (!q.plataforma || q.plataforma === plat) && roundIdx(q.rodada) <= roundIdx(round))
        .sort((a, b) => roundIdx(b.rodada) - roundIdx(a.rodada));
      if (!ents.length) return { html: '', sev: '' };
      const pasta = CFG.pastaPrints || '';
      const html = ents.map(q => `
          <div class="todo-title">${T('qaSaw')} · ${esc(q.plataforma ? platLabel(q.plataforma) : '')} ${esc(roundLabel(q.rodada))}</div>
          <div class="seen">${L(q.visto)}</div>
          ${q.auditor ? `<div class="seen"><b>${T(q.auditor.veredito === 'pass' ? 'audPass' : 'audFail')}</b>${q.auditor.visto ? ' · ' + L(q.auditor.visto) : ''}</div>` : ''}
          ${(q.prints || []).length ? `<div class="shots" title="${esc(T('shotsHint'))}">${q.prints.map(f => `<a href="${esc(pasta + f)}" target="_blank" rel="noopener"><img src="${esc(pasta + f)}" alt="${esc(f)}" loading="lazy"></a>`).join('')}</div>` : ''}`).join('');
      return { html, sev: ents[0].gravidade || '' };
    }
    const ICON = { pass: '✅', fail: '❌', skip: '🚫', wait: '⏳', auditFail: '🔎❌' };
    function histHTML(c) {
      const linhas = PLATS.filter(p => appliesPlat(c, p.id)).map(p => {
        const ms = ROUNDS.filter(r => mark(c.id, p.id, r.id).result).map(r => `${esc(L(r.curto || r.rotulo))} ${ICON[st(c, mark(c.id, p.id, r.id))]}`);
        return ms.length ? `<b>${esc(L(p.rotulo))}:</b> ${ms.join(' · ')}` : '';
      }).filter(Boolean);
      return linhas.length ? `<div class="hist">${T('history')} — ${linhas.join(' &nbsp;|&nbsp; ')}</div>` : '';
    }
    function visibleCards(tabId) {
      return CARDS.filter(c => c.aba === tabId && appliesPlat(c, VIEW.plat) && existsIn(c, VIEW.round)
        && (VIEW.show === 'all' || c.foraDoEscopo || needsTest(c, VIEW.plat, VIEW.round) || mark(c.id, VIEW.plat, VIEW.round).result)
        && (VIEW.variant === 'all' || !(c.variacoes || []).length || c.variacoes.includes(VIEW.variant)));
    }
    function render() {
      TABS.forEach(t => {
        const el = document.querySelector(`[data-render="${t.id}"]`);
        const list = visibleCards(t.id);
        el.innerHTML = list.length ? list.map(cardHTML).join('') : `<p class="empty">${T('nothing')}</p>`;
        const c = document.querySelector(`[data-count="${t.id}"]`);
        if (c) c.textContent = list.length;
      });
      renderFilters();
      updateProgress();
    }
    function rerenderCard(id) {
      const c = CARDS.find(x => x.id === id);
      const el = document.querySelector(`.card[data-id="${id}"]`);
      if (!c || !el) return;
      const wrap = document.createElement('div');
      wrap.innerHTML = cardHTML(c).trim();
      el.replaceWith(wrap.firstChild);
    }

    /* ─── FILTROS: variação e "o que mostrar" ───────────── */
    function renderFilters() {
      if (VAR && VAR.itens && VAR.itens.length) {
        const opts = [['all', L(VAR.todos) || 'Todos']].concat(VAR.itens.filter(v => !v.desde || roundIdx(v.desde) <= roundIdx(VIEW.round)).map(v => [v.id, L(v.rotulo)]));
        document.querySelectorAll('[data-filterbar]').forEach(bar => {
          bar.innerHTML = `<span class="fb-label">${esc(L(VAR.rotulo))}</span>` + opts.map(([v, l]) =>
            `<button class="fchip ${VIEW.variant === v ? 'active' : ''}" onclick="setVariant('${v}')">${esc(l)}</button>`).join('');
        });
      }
      document.querySelectorAll('[data-showbar]').forEach(bar => {
        bar.innerHTML = [['totest', T('showToTest')], ['all', T('showAll')]].map(([v, l]) =>
          `<button class="fchip ${VIEW.show === v ? 'active' : ''}" onclick="setShow('${v}')">${esc(l)}</button>`).join('');
      });
    }
    function setVariant(v) { VIEW.variant = v; saveView(); render(); }
    function setShow(v) { VIEW.show = v; saveView(); render(); }
    function setPlat(p) { VIEW.plat = p; saveView(); buildPickers(); fillEnv(); render(); atualizarPendentes(); }
    function setRound(r) { VIEW.round = r; saveView(); buildPickers(); render(); atualizarPendentes(); }

    /* ─── RESPOSTAS ─────────────────────────────────────── */
    function slot(id) {
      STATE.marcas[id] = STATE.marcas[id] || {};
      STATE.marcas[id][VIEW.plat] = STATE.marcas[id][VIEW.plat] || {};
      STATE.marcas[id][VIEW.plat][VIEW.round] = STATE.marcas[id][VIEW.plat][VIEW.round] || {};
      return STATE.marcas[id][VIEW.plat][VIEW.round];
    }
    function setResult(id, result) {
      const s = slot(id);
      s.result = s.result === result ? '' : result;
      if (s.result !== 'pass') delete s.audit;   // sem aprovação do QA, não há auditoria
      save(); rerenderCard(id); updateProgress(); atualizarPendentes();
    }
    function setAudit(id, v) {
      const s = slot(id);
      if (s.result !== 'pass') { toast(T('audWaitHint')); return; }
      s.audit = s.audit === v ? '' : v;
      if (!s.audit) delete s.audit;
      save(); rerenderCard(id); updateProgress(); atualizarPendentes();
    }
    function temNota(ans) { return !!((ans || {}).note || '').trim(); }
    function setNote(id, value) {
      const s = slot(id);
      s.note = value;
      // Atualiza o alerta âmbar sem redesenhar o card (o cursor continua na nota)
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (card) {
        const alerta = st(CARDS.find(x => x.id === id) || {}, s) === 'pass' && temNota(s);
        card.classList.toggle('has-note', alerta);
        const bt = card.querySelector('.seg button.pass');
        if (bt) bt.textContent = alerta ? T('passNote') : T('pass');
      }
      save(); renderSummary(); atualizarSaveRow(id); atualizarPendentes();
    }
    function setEnv(key, value) {
      STATE.env[VIEW.plat] = STATE.env[VIEW.plat] || {};
      STATE.env[VIEW.plat][key] = value; save(); atualizarPendentes();
    }
    function fillEnv() {
      const e = (STATE.env || {})[VIEW.plat] || {};
      ['device', 'os', 'app'].forEach(k => { const el = document.getElementById('env-' + k); if (el) el.value = e[k] || ''; });
    }

    /* ─── SALVAR NO ARQUIVO ─────────────────────────────── */
    const NOME_ARQUIVO = decodeURIComponent(location.pathname.split('/').pop() || '');
    let PODE_SALVAR = false;
    /* Tira marcas vazias, para "nada marcado" e "objeto vazio" contarem igual. */
    function limpo(m) {
      const out = {};
      Object.keys(m || {}).forEach(p => Object.keys(m[p] || {}).forEach(r => {
        const a = m[p][r] || {}, res = a.result || '', note = a.note || '', aud = a.audit || '';
        if (res || note || aud) { out[p] = out[p] || {}; out[p][r] = { result: res, note, audit: aud }; }
      }));
      return out;
    }
    function cardSujo(id) { return JSON.stringify(limpo(STATE.marcas[id])) !== JSON.stringify(limpo(SALVO.marcas[id])); }
    function cardSalvo(id) { const a = ((SALVO.marcas[id] || {})[VIEW.plat] || {})[VIEW.round] || {}; return !!(a.result || a.note || a.audit); }
    function envSujo() { return JSON.stringify(STATE.env || {}) !== JSON.stringify(SALVO.env || {}); }
    function saveRowHTML(id) {
      const sujo = cardSujo(id);
      const estado = sujo ? `<span class="save-state dirty">${T('notSaved')}</span>`
        : cardSalvo(id) ? `<span class="save-state ok">${T('savedOk')}</span>` : '<span class="save-state"></span>';
      return `${estado}<button class="btn" onclick="salvarCard('${id}')" ${sujo ? '' : 'disabled'}>${T('saveBtn')}</button>`;
    }
    function atualizarSaveRow(id) {
      const row = document.querySelector(`.card[data-id="${id}"] .save-row`);
      if (row) row.innerHTML = saveRowHTML(id);
    }
    function atualizarPendentes() {
      const n = CARDS.filter(c => !c.foraDoEscopo && cardSujo(c.id)).length;
      const partes = [];
      if (n) partes.push(T('cards', { n }));
      if (envSujo()) partes.push(T('theDevice'));
      const el = document.getElementById('pendentesSalvar');
      if (el) el.textContent = partes.length ? T('unsavedList', { x: partes.join(' + ') }) : '';
    }
    async function gravarNoArquivo(novo) {
      if (!PODE_SALVAR) { toast(T('readOnlyToast')); return false; }
      try {
        const r = await fetch('/__salvavel/salvar?arquivo=' + encodeURIComponent(NOME_ARQUIVO), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Salvavel': '1' },
          body: JSON.stringify({ versao: 2, salvoEm: new Date().toISOString(), marcas: novo.marcas, env: novo.env })
        });
        const j = await r.json();
        if (!j.ok) throw new Error(j.erro || 'erro desconhecido');
        SALVO = clone(novo);
        save();
        return true;
      } catch (e) {
        toast(T('saveFailed', { e: e.message || e }));
        return false;
      }
    }
    async function salvarCard(id) {
      const novo = clone(SALVO);
      const m = limpo(STATE.marcas[id]);
      if (Object.keys(m).length) novo.marcas[id] = m; else delete novo.marcas[id];
      if (await gravarNoArquivo(novo)) { atualizarSaveRow(id); atualizarPendentes(); toast(T('savedToast', { id })); }
    }
    async function salvarTudo() {
      const marcas = {};
      Object.keys(STATE.marcas).forEach(id => { const m = limpo(STATE.marcas[id]); if (Object.keys(m).length) marcas[id] = m; });
      if (await gravarNoArquivo({ marcas, env: clone(STATE.env) })) {
        CARDS.forEach(c => atualizarSaveRow(c.id)); atualizarPendentes(); toast(T('allSavedToast'));
      }
    }
    function syncSaveMode() {
      const el = document.getElementById('saveMode');
      el.textContent = PODE_SALVAR ? T('modeOn') : T('modeOff');
      el.classList.toggle('on', PODE_SALVAR);
    }
    async function detectarServidor() {
      if (location.protocol.startsWith('http')) {
        try { PODE_SALVAR = (await (await fetch('/__salvavel/status', { cache: 'no-store' })).json()).ok === true; } catch (e) {}
      }
      syncSaveMode();
    }
    window.addEventListener('beforeunload', e => {
      if (CARDS.some(c => cardSujo(c.id)) || envSujo()) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ─── PROGRESSO, RESUMO E COMPARAÇÃO ────────────────── */
    function counts() {
      const c = { pass: 0, fail: 0, skip: 0, wait: 0, auditFail: 0, pending: 0 };
      inScope().forEach(x => { const r = st(x, mark(x.id, VIEW.plat, VIEW.round)); c[r || 'pending']++; });
      return c;
    }
    function updateProgress() {
      const c = counts(), total = inScope().length;
      const answered = total - c.pending;
      const pct = total ? Math.round(answered / total * 100) : 0;
      document.getElementById('walk-progress').innerHTML = `
        <div class="walk-progress-top">
          <span class="walk-progress-label">${esc(platLabel(VIEW.plat))} · ${esc(roundLabel(VIEW.round))} — ${T('checked', { a: answered, t: total, p: pct })}</span>
          <span class="walk-progress-counts">
            <span>✅ ${c.pass} ${T('cPass')}</span><span>❌ ${c.fail} ${T('cFail')}</span>${AUD ? `<span>⏳ ${c.wait} ${T('cWait')}</span><span>🔎❌ ${c.auditFail} ${T('cAuditFail')}</span>` : ''}<span>🚫 ${c.skip} ${T('cSkip')}</span><span>⬜ ${c.pending} ${T('cPend')}</span>
          </span>
        </div>
        <div class="walk-progress-bar-track"><div class="walk-progress-bar-fill" style="width:${pct}%"></div></div>`;
      const nav = document.querySelector('[data-count="resultado"]');
      if (nav) nav.textContent = c.pending;
      renderSummary();
      renderCompare();
      buildNavSelect();
    }
    function renderSummary() {
      const groups = [['fail', T('fail')], ['auditFail', T('auditFailLbl')], ['wait', T('waitLbl')], ['skip', T('skip')], ['pass', T('pass')], ['', T('pending')]];
      let html = '';
      groups.forEach(([r, label]) => {
        const rows = inScope().filter(c => st(c, mark(c.id, VIEW.plat, VIEW.round)) === r);
        if (!rows.length) return;
        html += `<div class="sum-h">${label} (${rows.length})</div><div class="sumlist">` + rows.map(c => {
          const note = mark(c.id, VIEW.plat, VIEW.round).note;
          return `<div class="sumrow ${r}"><span class="walk-row-id">${esc(c.id)}</span><span>${L(c.titulo)}${note ? ` — <em>${esc(note)}</em>` : ''}</span></div>`;
        }).join('') + '</div>';
      });
      document.getElementById('summary').innerHTML = html || `<p class="empty">${T('nothing')}</p>`;
    }
    /* Célula: marca desta rodada; senão, a última anterior (↺); "—" se o card não vale para a plataforma. */
    function cellFor(c, plat) {
      if (!appliesPlat(c, plat)) return '<span class="muted">—</span>';
      const m = mark(c.id, plat, VIEW.round);
      if (m.result) return ICON[st(c, m)];
      const p = prevMark(c, plat, VIEW.round);
      return p ? `<span class="muted">↺ ${ICON[p.result]}</span>` : '<span class="muted">⬜</span>';
    }
    function renderCompare() {
      const el = document.getElementById('compare');
      const cards = CARDS.filter(c => !c.foraDoEscopo && existsIn(c, VIEW.round));
      if (!cards.length || !PLATS.length) { el.innerHTML = ''; return; }
      el.innerHTML = `<table class="cmp"><thead><tr><th>${T('cmpCard')}</th>${PLATS.map(p => `<th class="c">${esc(L(p.rotulo))}</th>`).join('')}</tr></thead><tbody>`
        + cards.map(c => `<tr><td><b>${esc(c.id)}</b> ${L(c.titulo)}</td>${PLATS.map(p => `<td class="c">${cellFor(c, p.id)}</td>`).join('')}</tr>`).join('')
        + `</tbody></table><p class="na-pill" style="padding:8px 10px">${T('cmpLegend')}</p>`;
    }

    /* ─── EXPORTAR ──────────────────────────────────────── */
    function exportCommand() {
      const plain = s => String(s).replace(/<[^>]+>/g, '');
      const parts = [T('exportIntro', { t: plain(L(CFG.titulo)), r: plain(roundLabel(VIEW.round)) }), T('exportAsk')];
      PLATS.forEach(p => {
        const scope = CARDS.filter(c => needsTest(c, p.id, VIEW.round));
        if (!scope.length) return;
        const e = (STATE.env || {})[p.id] || {};
        const c = { pass: 0, fail: 0, skip: 0, wait: 0, auditFail: 0, '': 0 };
        scope.forEach(x => c[st(x, mark(x.id, p.id, VIEW.round))]++);
        parts.push('', `=== ${plain(L(p.rotulo))} ===`,
          `${T('exportDevice')}: ${e.device || '?'} · ${e.os || '?'} · app ${e.app || '?'}`,
          `${T('exportSummary')}: ${c.pass} ${T('cPass')} · ${c.fail} ${T('cFail')}${AUD ? ` · ${c.wait} ${T('cWait')} · ${c.auditFail} ${T('cAuditFail')}` : ''} · ${c.skip} ${T('cSkip')} · ${c['']} ${T('cPend')} (${scope.length})`);
        [['fail', 'FAIL'], ['auditFail', 'AUDITFAIL'], ['wait', 'WAIT'], ['skip', 'SKIP'], ['pass', 'PASS'], ['', 'PEND']].forEach(([r, k]) => {
          const rows = scope.filter(x => st(x, mark(x.id, p.id, VIEW.round)) === r);
          if (rows.length) parts.push('', `${T(k)} (${rows.length}):`, ...rows.map(x => {
            const n = mark(x.id, p.id, VIEW.round).note;
            return `- ${x.id} — ${plain(L(x.titulo))}${n ? ' — ' + T('noteWord') + ': ' + n.replace(/\s+/g, ' ').trim() : ''}`;
          }));
        });
      });
      copyText(parts.join('\n'));
    }
    function copyText(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(() => toast(T('copiedToast')), () => fallbackCopy(t));
      } else { fallbackCopy(t); }
    }
    function fallbackCopy(t) {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); toast(T('copiedToast')); }
      catch (e) { toast(T('copyFailed')); }
      document.body.removeChild(ta);
    }
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    /* ─── TEMA E IDIOMA ─────────────────────────────────── */
    function syncThemeToggleUI() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('themeToggleIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('themeToggleLabel').textContent = isDark ? T('themeLight') : T('themeDark');
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ssq_theme', next); } catch (e) {}
      syncThemeToggleUI();
    }
    function toggleLang() {
      LANG = LANG === 'en' ? 'pt' : 'en';
      try { localStorage.setItem('roteiro_lang', LANG); } catch (e) {}
      boot();
    }

    /* ─── ABAS ──────────────────────────────────────────── */
    function showTab(id) {
      if (!document.getElementById(id)) id = 'como';
      document.querySelectorAll('.tab-content').forEach(s => s.classList.toggle('active', s.id === id));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
      const sel = document.getElementById('navSelect');
      if (sel && sel.value !== id) sel.value = id;
      VIEW.tab = id; saveView();
    }
    function buildNavSelect() {
      const sel = document.getElementById('navSelect');
      sel.innerHTML = '';
      document.querySelectorAll('.nav-tab').forEach(btn => {
        let label = '';
        btn.childNodes.forEach(n => { if (n.nodeType === 3) label += n.textContent; });
        const countEl = btn.querySelector('.nav-count');
        const count = countEl ? countEl.textContent.trim() : '';
        const opt = document.createElement('option');
        opt.value = btn.dataset.tab;
        opt.textContent = label.replace(/\s+/g, ' ').trim() + (count ? '  (' + count + ')' : '');
        if (btn.dataset.tab === VIEW.tab) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    /* ─── INÍCIO ────────────────────────────────────────── */
    function boot() {
      applyStatic();
      buildPickers();
      buildTabs();
      fillEnv();
      render();
      showTab(VIEW.tab);
      atualizarPendentes();
    }
    boot();
    detectarServidor();
  </script>
</body>
</html>
