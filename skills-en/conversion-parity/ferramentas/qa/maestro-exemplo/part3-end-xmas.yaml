appId: ${APP}
# Xmas end-game: santa thank-you -> dialogs -> open the gift -> FINISH GAME.
# Storyboard frames keyed by ${THEME} into screenshots/flow-<THEME>/.
---
- takeScreenshot: "shots/${DEV}/${THEME}-15-end-1-santa"
- runFlow:
    when:
        visible:
            id: "santaThankYouContinueButton"
    commands:
        - tapOn:
            id: "santaThankYouContinueButton"
- repeat:
    while:
        notVisible: .*Tap and Hold to open the gift.*
    commands:
        - tapOn:
            text: "Next"
            waitUntilVisible: true
- takeScreenshot: "shots/${DEV}/${THEME}-15-end-2-gift"
- longPressOn: "creatures-trap-xmas"
- extendedWaitUntil:
    visible: "FINISH GAME"
    timeout: 25000
- takeScreenshot: "shots/${DEV}/${THEME}-15-end-3-finish"
- tapOn: "FINISH GAME"
