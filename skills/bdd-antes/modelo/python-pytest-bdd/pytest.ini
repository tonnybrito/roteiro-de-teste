# BDD runner, separate from the project's own test config.
# Run from this folder:  cd BDD && <project python> -m pytest
# Test files are bdd_*.py (never test_*.py), so the project's own pytest never collects them.
# Each run also writes the Cucumber JSON report that bdd_html.py embeds in the page.
[pytest]
python_files = bdd_*.py
bdd_features_base_dir = features/
pythonpath = .
addopts = -p steps.common -p no:cacheprovider --cucumberjson=resultados-cucumber.json
markers =
    manual: checked by hand, never run
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
