appId: ${APP}
# Part 2: lore/tutorial pages, then the nine captures (frames for every capture)
---
- evalScript: ${output.n = 0}
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    while:
        visible:
            id: "guideDialogNextButton"
    commands:
        - evalScript: ${output.n = output.n + 1}
        - takeScreenshot: "shots/${DEV}/${THEME}-12-tutorial-${output.n}"
        - tapOn:
            id: "guideDialogNextButton"
        - waitForAnimationToEnd:
            timeout: 1500
- evalScript: ${output.n = output.n + 1}
- takeScreenshot: "shots/${DEV}/${THEME}-12-tutorial-${output.n}"
- takeScreenshot: "shots/${DEV}/${THEME}-13-hub-ready"
- tapOn:
    id: "trapSlot_0"
- runFlow:
    when:
        visible: "^Allow.*|^Permitir.*|^OK$"
    commands:
        - tapOn: "^Allow.*|^Permitir.*|^OK$"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "shots/${DEV}/${THEME}-14-cap1-a-scanner"
- tapOn: "Scan next"
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
        visible:
            id: "qrScanFrame"
    commands:
        - tapOn: "Scan next"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "shots/${DEV}/${THEME}-14-cap1-b-found"
- longPressOn:
    id: "captureFlowTrapButton"
- extendedWaitUntil:
    visible: "CONTINUE"
    timeout: 150000
- takeScreenshot: "shots/${DEV}/${THEME}-14-cap1-c-card"
- tapOn: "CONTINUE"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
        visible: "CONTINUE"
    commands:
        - takeScreenshot: "shots/${DEV}/${THEME}-14-cap1-d-extra"
