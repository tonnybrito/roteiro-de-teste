<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- fundo no formato de ícone do Mac -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <!-- a página HTML -->
  <g filter="url(#sh)">
    <path d="M300 220 H610 L724 334 V780 a24 24 0 0 1 -24 24 H300 a24 24 0 0 1 -24 -24 V244 a24 24 0 0 1 24 -24 Z" fill="#FFFFFF"/>
    <path d="M610 220 V310 a24 24 0 0 0 24 24 H724 Z" fill="#C7D2FE"/>
  </g>
  <!-- </> -->
  <g fill="none" stroke="#4F46E5" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="420,400 352,460 420,520"/>
    <polyline points="580,400 648,460 580,520"/>
    <line x1="530" y1="380" x2="470" y2="540"/>
  </g>
  <!-- linhas de texto -->
  <g stroke="#E0E7FF" stroke-width="22" stroke-linecap="round">
    <line x1="340" y1="620" x2="560" y2="620"/>
    <line x1="340" y1="680" x2="500" y2="680"/>
  </g>
  <!-- selo verde: salvar (seta entrando na bandeja) -->
  <g filter="url(#sh)">
    <circle cx="700" cy="720" r="150" fill="url(#badge)"/>
    <circle cx="700" cy="720" r="150" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <line x1="700" y1="640" x2="700" y2="740"/>
    <polyline points="652,694 700,742 748,694"/>
    <path d="M632 742 V780 a12 12 0 0 0 12 12 H756 a12 12 0 0 0 12 -12 V742"/>
  </g>
</svg>
